name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The app is built against the SDK source, branch iris-v2, until 0.7.0 is on Maven Central
      - uses: actions/checkout@v4
        with:
          repository: biometric-technologies/biometric-sdk
          ref: iris-v2
          path: sdk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: iriscan-sdk-demo
          path: app/build/outputs/apk/debug/app-debug.apk
